/* ================= 发音（事件委托，避免引号冲突） ================= */
let VOICES=[];
function loadVoices(){VOICES=speechSynthesis.getVoices();}
loadVoices(); speechSynthesis.onvoiceschanged=loadVoices;
function pickVoice(){
  const pref=["Samantha","Google US English","Microsoft Zira","Microsoft Aria","Ting-Ting","Mei-Jia"];
  for(const p of pref){const v=VOICES.find(v=>v.name.includes(p)&&v.lang.startsWith("en"));if(v)return v;}
  return VOICES.find(v=>v.lang.startsWith("en"))||null;
}
function speak(t,btn){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=0.88;
  const v=pickVoice();if(v)u.voice=v;
  speechSynthesis.speak(u);
  if(btn){btn.style.transform="scale(1.4)";setTimeout(()=>btn.style.transform="",300);}
}
/* 点击页面任意 🔊 按钮时触发（文本存 data-say，HTML 转义，任何引号都安全） */
document.addEventListener("click",function(e){
  const b=e.target.closest(".spk");
  if(b&&b.dataset.say){speak(b.dataset.say,b);}
});
/* 导航统一走当前窗口路由，绝不打开新窗口 */
document.addEventListener("click",function(e){
  const a=e.target.closest("[data-go]");
  if(a){e.preventDefault();location.hash=a.dataset.go;}
});
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ================= 渲染 ================= */
const nav=document.getElementById("nav"),app=document.getElementById("app");
const CN=["一","二","三","四","五","六","七","八","九","十"];
function renderNav(active){
  let h='<div class="navtitle">课程笔记</div>';
  LESSONS.forEach(l=>{
    const badge=l.pending?"待更新":String(l.date).slice(5);
    h+='<a href="#/lesson/'+l.id+'" data-go="#/lesson/'+l.id+'" class="'+(active==="lesson-"+l.id?"active":"")+'">📖 第'+(CN[l.id-1]||l.id)+'课<span class="badge">'+badge+"</span></a>";
  });
  h+='<div class="navtitle">工具</div><a href="#/vocab" data-go="#/vocab" class="'+(active==="vocab"?"active":"")+'">📚 生词本<span class="badge">'+WORDS.length+'词</span></a><a href="#/" data-go="#/" class="'+(active==="home"?"active":"")+'">🏠 首页</a>';
  nav.innerHTML=h;
}
function renderHome(){
  renderNav("home");
  app.innerHTML=
  '<div class="hero"><h2>Hi Hanna！👋 开始复习吧</h2>'+
  '<p>这里是你的专属英语复习站：每节课的笔记、句型、对话都在左边菜单里；生词本可以点 🔊 随时听发音、看例句。每天坚持开口读，进步看得见！</p>'+
  '<div class="stat">'+
    '<div><b>'+LESSONS.filter(l=>!l.pending).length+'</b><span>已更新课程</span></div>'+
    '<div><b>'+WORDS.length+'</b><span>生词</span></div>'+
    '<div><b>×3</b><span>课文每日朗读</span></div>'+
  '</div></div>'+
  '<section class="card"><h3><span class="num">★</span>学习打卡任务</h3>'+
  '<ul class="lines">'+
   '<li>✅ 新概念课文：先看懂中文 → 再听录音跟读 → 降低音量、气息平稳、抑扬顿挫</li>'+
   '<li>✅ 每课用学过的句型造 2 个句子，微信语音发给 Mike 老师</li>'+
   '<li>✅ 抓住每一次和外国人聊天的机会实战：重复对方 + 给感受 + 顺着追问</li>'+
  '</ul></section>'+
  '<div class="update-note">📌 <b>老师如何更新本网站：</b>打开 <code>index.html</code>，搜索 <code>★★★ 新课程粘贴在这一行</code>，按数据格式粘贴新课程；搜索 <code>★★★ 新单词粘贴在这一行</code> 添加单词（支持 w/p/pos/m/e/em/cat 字段），保存即可自动出现在网站上。</div>';
}
function secHtml(s){
  if(s.type==="dialog"){
    return '<section class="card"><h3><span class="num">💬</span>'+s.t+"</h3>"+
    s.lines.map(l=>'<div class="line"><span class="who">'+esc(l[0])+':</span> <span class="txt en">'+esc(l[1])+"</span> "+SPK(l[1])+"</div>").join("")+
    (s.note?'<div class="tip">💡 '+s.note+"</div>":"")+"</section>";
  }
  if(s.type==="article"){
    return '<section class="card"><h3><span class="num">📄</span>'+s.t+'</h3><div class="article">'+
    s.paras.map(p=>'<p class="en">'+esc(p[0])+" "+SPK(p[0])+'</p><p class="cn">'+esc(p[1])+"</p>").join("")+
    '</div>'+(s.note?'<div class="tip">💡 '+s.note+"</div>":"")+"</section>";
  }
  if(s.type==="table"){
    return '<section class="card"><h3><span class="num">🎯</span>'+s.t+'</h3>'+
    '<table class="pairs"><tr><th style="width:45%">中文</th><th>English</th></tr>'+
    s.rows.map(r=>'<tr><td>'+esc(r[0])+'</td><td><span class="en">'+esc(r[1])+"</span> "+SPK(r[1])+"</td></tr>").join("")+"</table></section>";
  }
  if(s.type==="homework"){
    return '<section class="card"><h3><span class="num">📝</span>'+s.t+'</h3><div class="homework-box"><b>作业：</b>'+s.text+"</div></section>";
  }
  return '<section class="card"><h3><span class="num">📌</span>'+s.t+'</h3><ul class="lines">'+
  s.items.map(i=>"<li>"+i+"</li>").join("")+"</ul>"+
  (s.note?'<div class="tip">💡 '+s.note+"</div>":"")+"</section>";
}
function renderLesson(id){
  const l=LESSONS.find(x=>x.id===id); if(!l)return renderHome();
  renderNav("lesson-"+id);
  let body="";
  if(l.pending){
    body='<div class="pending"><div class="big">📼</div><h3 style="color:var(--brand);margin-bottom:8px">这节课没有录制回放</h3><p style="font-size:14px;color:#7a6a5e">第三课当时忘记开启录制了 😅<br>等 Hanna 回忆课堂内容、或老师补充笔记后，会第一时间更新到这里。<br><br>可以先去复习 <a href="#/lesson/2" data-go="#/lesson/2" style="color:var(--brand);font-weight:600">第二课 →</a> <a href="#/lesson/4" data-go="#/lesson/4" style="color:var(--brand);font-weight:600">第四课 →</a></p></div>';
  }else{
    body=l.sections.map(secHtml).join("");
  }
  const prev=LESSONS.find(x=>x.id===id-1),next=LESSONS.find(x=>x.id===id+1);
  let pager='<div style="display:flex;gap:10px;margin-top:6px">'+
  (prev?'<a href="#/lesson/'+prev.id+'" data-go="#/lesson/'+prev.id+'" style="background:#fff;border:1px solid var(--line);padding:9px 18px;border-radius:99px;font-size:13px">← 上一课</a>':"")+
  (next?'<a href="#/lesson/'+next.id+'" data-go="#/lesson/'+next.id+'" style="background:var(--brand);color:#fff;padding:9px 18px;border-radius:99px;font-size:13px">下一课 →</a>':"")+
  "</div>";
  app.innerHTML='<div class="crumb"><a href="#/" data-go="#/">首页</a> / 第'+(CN[l.id-1]||l.id)+'课</div>'+
  '<h2 class="lesson-title">'+l.title+'</h2>'+
  '<div class="lesson-meta"><span>📅 '+l.date+'</span><span>👨‍🏫 Mike 老师</span><span>'+l.subtitle+"</span></div>"+
  body+pager;
}
let curFilter="全部";
function renderVocab(){
  renderNav("vocab");
  const cats=["全部"].concat(Array.from(new Set(WORDS.map(w=>w.cat))));
  const list=curFilter==="全部"?WORDS:WORDS.filter(w=>w.cat===curFilter);
  app.innerHTML='<div class="crumb"><a href="#/" data-go="#/">首页</a> / 生词本</div>'+
  '<h2 class="lesson-title">📚 生词本 <small style="font-size:13px;color:var(--sub)">共 '+list.length+' 个 · 点 🔊 听发音</small></h2>'+
  '<div class="filterbar" style="margin-top:14px">'+cats.map(c=>'<button class="'+(c===curFilter?"on":"")+'" data-filter="'+esc(c)+'">'+esc(c)+(c==="全部"?"":" · "+WORDS.filter(w=>w.cat===c).length)+"</button>").join("")+"</div>"+
  '<div class="grid-vocab">'+list.map(w=>
   '<div class="vcard">'+
    '<div class="top"><span class="word">'+esc(w.w)+"</span>"+SPK(w.w)+'<span class="ph">'+esc(w.p)+'</span><span class="pos">'+esc(w.pos)+"</span></div>"+
    '<div class="mean">'+esc(w.m)+"</div>"+
    '<div class="ex en">'+esc(w.e)+" "+SPK(w.e)+"</div>"+
    (w.em?'<div class="excn">'+esc(w.em)+"</div>":"")+
   "</div>").join("")+"</div>";
}
/* 生词分类筛选（事件委托） */
document.addEventListener("click",function(e){
  const b=e.target.closest("[data-filter]");
  if(b){curFilter=b.dataset.filter;renderVocab();}
});
function route(){
  const h=location.hash;
  const m=h.match(/#\/lesson\/(\d+)/);
  if(m)renderLesson(+m[1]);
  else if(h==="#/vocab")renderVocab();
  else renderHome();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
