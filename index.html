/* ================= 发音（事件委托，避免引号冲突） ================= */
let VOICES=[];
function loadVoices(){VOICES=speechSynthesis.getVoices();}
loadVoices(); speechSynthesis.onvoiceschanged=loadVoices;
function pickVoice(){
  const pref=["Samantha","Google US English","Microsoft Zira","Microsoft Aria","Ting-Ting","Mei-Jia"];
  for(const p of pref){const v=VOICES.find(v=>v.name.includes(p)&&v.lang.startsWith("en"));if(v)return v;}
  return VOICES.find(v=>v.lang.startsWith("en"))||null;
}
function speak(t,btn){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=0.88;
  const v=pickVoice();if(v)u.voice=v;
  speechSynthesis.speak(u);
  if(btn){btn.style.transform="scale(1.4)";setTimeout(()=>btn.style.transform="",300);}
}
/* 点击页面任意 🔊 按钮时触发（文本存 data-say，HTML 转义，任何引号都安全） */
document.addEventListener("click",function(e){
  const b=e.target.closest(".spk");
  if(b&&b.dataset.say){speak(b.dataset.say,b);}
});
/* 导航统一走当前窗口路由，绝不打开新窗口 */
document.addEventListener("click",function(e){
  const a=e.target.closest("[data-go]");
  if(a){e.preventDefault();location.hash=a.dataset.go;}
});
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const SPK=t=>'<button class="spk" data-say="'+esc(t)+'" title="播放发音" type="button">🔊</button>';

  {t:"课文精读 · Letters from Australia（新概念二 L4）",type:"article",paras:[

{
 id:5, date:"2026-09-21", title:"第五课：实战复盘 + 「描述一天」四句话框架",
 subtitle:"Less is more 少而准确 · 陈述句框架 · 朗读重音节奏",
 review:["① 四句话框架每日口头练：早上说 today 版，晚上说 yesterday 版，一天不落。","② 重音朗读：拿课文用荧光笔标出动词，重读动词、轻读其他，录下来对比原音。","③ 脱稿复述：看关键词（感受/事件/缘由/计划）不看句子，复述 Mike 的示范段。","④ 造句迁移：把示范段里的「修车」换成你真实的某件事（见客户/看展），说一遍。"],
 extra:["<b>语音冷知识：</b>英语是「重音计时」语言——句子快慢由重音词决定，重音词之间无论几个轻读词都算一拍；中文是「音节计时」，所以逐字读英文会很怪。","<b>弱读清单：</b>a / of / to / and 在句中通常轻读成 /ə/ /əv/ /tə/，这是听力的关键。","<b>建议开始写英语日记：</b>每天 3-4 句（就是四句话框架），写一周就能明显感觉口语变顺。","<b>百分数读法：</b>50% = fifty percent，别读成 fifty percents（不加 s）。"],
 sections:[
  {t:"实战复盘 · 第一次和外国朋友聊天",type:"dialog",lines:[
   ["Mike","How are you today?"],
   ["Hanna","I'm fine. Yesterday I had a conversation with a new friend."],
   ["Mike","Great! Did you ask the questions we practiced?"],
   ["Hanna","Yes, but I forgot many words. I just used simple words. I didn't use the translator."],
   ["Mike","That's okay. Simple is efficient!"],
   ["Hanna","He told me he uses Meituan to order food in English. Many people can't understand him."],
   ["Mike","Haha! Same for you. But it's a good environment to practice. How was your listening?"],
   ["Hanna","If he speaks slowly with simple words, I can understand. Foreigners are friendly."],
   ["Mike","I was nervous the first time too. Mindset matters — just communicate!"]],
   note:"心得：① 用最简单的词完全够用，对方会顺着你的水平说；② 听懂了意思就大方回应，爱笑也是情绪价值；③ 开口之后发现「也没什么的」，心态捋顺最重要。"},
  {t:"课文精读 · Percy Buttons 珀西·巴顿斯（新概念二 L6）",type:"article",paras:[
   ["I have just moved to a house in Bridge Street. Yesterday a beggar knocked at my door. He asked me for a meal and a glass of beer.","我刚搬到大桥街的一所房子。昨天一个乞丐来敲我的门，跟我要一顿饭和一杯啤酒。"],
   ["In return for this, the beggar stood on his head and sang songs. I gave him a meal. He ate the food and drank the beer.","作为回报，那个乞丐倒立着唱了几首歌。我给了他一顿饭。他吃完食物、喝光了啤酒。"],
   ["Then he put a piece of cheese in his pocket and went away. Later a neighbour told me about him. Everybody knows him. His name is Percy Buttons.","然后他把一块奶酪放进口袋里就走了。后来一位邻居跟我讲起他。大家都认识他，他叫珀西·巴顿斯。"],
   ["He calls at every house in the street once a month and always asks for a meal and a glass of beer.","他每个月来这条街上的每户人家一次，总是要一顿饭和一杯啤酒。"]],
   note:"新词：beggar 乞丐 / knock at 敲（门）/ in return 作为回报 / pocket 口袋 / neighbour 邻居（美式 neighbor）/ once a month 每月一次。"},
  {t:"朗读升级 · 重音与节奏",type:"list",items:[
   "<b>核心技巧：</b>一个句子中挑重点词（尤其是<b>动词</b>）大声重读，其余词<b>小点声、快点读</b>。",
   "示范：<span class='en'>I have just MOVED to a house in BRIDGE STREET. A BEGGAR KNOCKED at my door.</span>",
   "有高有低、抑扬顿挫——流利度之外，<b>节奏</b>更重要。记住：慢读重点词，快读次要词。"]},
  {t:"必背三句话 + 自我介绍四句（第四课复习）",type:"table",rows:[
   ["我不太熟悉国外的工作氛围，能多跟我说说吗？","I'm not familiar with the work atmosphere abroad. Could you tell me more?"],
   ["你最近有什么有趣的经历吗？","What interesting experiences do you have recently?"],
   ["你觉得这边方便吗？和国外比呢？","Do you feel convenient here? How is it compared with abroad?"],
   ["我来自青岛，背景是服装设计。","I'm from Qingdao. My background is clothing design."],
   ["我只会说一点英语。","I can only speak a little English."]]},
  {t:"核心框架 · 用 3~4 句话描述你的一天",type:"list",items:[
   "<b>原则：Less is more</b> —— 少而准确、高效。人家问你今天干了什么，3~4 句讲完，别说十句！",
   "<b>第 1 句 · 说感受：</b><span class='en'>Today I feel very happy. / I'm very glad.</span>（happy / nice / glad / pleased 都可以）",
   "<b>第 2 句 · 说重点：</b>一两件最重要的事，<b>用过去式</b>，时间点前面加 <b>at</b>：<span class='en'>I went to the Four S car store at eleven o'clock and handled some car problems.</span>",
   "<b>第 3 句 · 说缘由：</b>这件事感觉如何 + 为什么：<span class='en'>It was nice because the whole process was going smoothly.</span>（whole process 整个过程 / smoothly 顺利地）",
   "<b>第 4 句 · 说现在或将来（可选）：</b><span class='en'>After that, I want to be careful about this situation.</span>",
   "把 today 换成 yesterday 就是昨天的版本：<span class='en'>Yesterday I was glad and a little nervous. I went to a coffee shop…</span>"]},
  {t:"句型操练 · Mike 示范 & Hanna 跟练",type:"dialog",lines:[
   ["Mike（示范）","Today I feel very happy. I went to the Four S car store at eleven o'clock and handled some car problems. It was fine because the whole process was going smoothly. After that, I want to be careful about this situation."],
   ["Hanna（跟练）","Today I'm very glad. I went to Four S at eleven and handled car problems. It was very nice because everything was going smoothly. After that, I want to be careful when driving."]],
   note:"提示：描述日常小事即可（运动、取车、保险赔付……），挑重点说，有头有尾。"},
  {t:"课后作业",type:"homework",text:"① 用「四句话框架」分别说一遍 today 和 yesterday 版本，练到流利后录音发给老师；② 课文 L6 朗读 3 遍，刻意练习「动词重读、其他轻读」的节奏；③ 必背三句话 + 自我介绍四句每天复习一遍；④ 继续和外国朋友实战：这次记得至少反问 2 个问题（他问什么，你就反问他什么）。"}
 ]

{
 id:6, date:"2026-09-23", title:"第六课：并列句 and / but / so + 副词的位置",
 subtitle:"简单句+连接词=流利口语 · 造句大练兵",
 review:["① 六句核心句默写：看中文写英文，连续 3 天全对才算过关。","② 连词成段练习：写 3 个短句，分别用 and / but / so 连成一段话，发给老师。","③ 副词位置填空：给 5 个句子，把 currently / originally / recently 放到正确位置。","④ 语法判断口诀演练：拿到任何陈述句，先判断主系表还是主谓宾，再说出口。"],
 extra:["<b>判断口诀：</b>句子里有「是/在/变得」→ 主系表（用 am/is/are）；有「做/吃/买/卖」→ 主谓宾（用 do/does）。","<b>连接词进阶：</b>or（或者）、so that（以便）、however（然而，书面）、while（而/当）。","<b>易错点：</b>although 和 but 二选一，不能连用；because 和 so 也不能连用。","<b>develop 家族：</b>develop（v. 发展）→ development（n. 发展）→ developed（adj. 发达的）→ developing（adj. 发展中的）。"],
 sections:[
  {t:"热身 · 用「四句话框架」说今天",type:"dialog",lines:[
   ["Mike","What did you do today? Could you tell me more?"],
   ["Hanna","Today I'm unhappy. I received a call from the insurance company."],
   ["Hanna","They refused compensation, so I want to handle it tomorrow."],
   ["Mike","Sorry to hear that. Is there anything you can do?"],
   ["Hanna","I will check the car camera video and provide more proof."],
   ["Mike","Good luck! Everything is gonna be okay."]],
   note:"新词：compensation 赔偿（n.）。保险拒赔：refuse compensation。梳理框架：感受 → 发生了什么 → 原因 → 下一步计划，有头有尾。"},
  {t:"课文复习 · Percy Buttons（新概念二 L6）",type:"article",paras:[
   ["I have just moved to a house in Bridge Street. Yesterday a beggar knocked at my door. He asked me for a meal and a glass of beer.","（复习朗读）我刚搬到大橋街的一所房子，昨天一个乞丐敲门跟我要一顿饭和一杯啤酒。"],
   ["In return for this, the beggar stood on his head and sang songs. I gave him a meal. He ate the food and drank the beer.","作为回报，乞丐倒立着唱歌。我给了他一顿饭。"],
   ["Then he put a piece of cheese in his pocket and went away. Later a neighbour told me about him. Everybody knows him. His name is Percy Buttons.","然后他把奶酪放进口袋走了。后来邻居告诉我，大家都认识他，他叫珀西·巴顿斯。"],
   ["He calls at every house in the street once a month and always asks for a meal and a glass of beer.","他每月来这条街每户一次，总要一顿饭和一杯啤酒。"]],
   note:"短语：stand on one's head 倒立。复习读词法：每个单词「两英一中」读两遍英文、一遍中文，坚持课后自己复习。"},
  {t:"核心语法 · 并列句（今日重点）",type:"list",items:[
   "<b>陈述句只有两种框架：</b>① 主系表（描述身份/状态：我是什么）② 主谓宾（描述动作：我做了什么）。",
   "<b>流利口语的秘密：</b>把简单句用连接词连起来！老外说的句子不长、词不高级，但流利准确——靠的就是并列句。",
   "<b>and</b> = 并列（同类信息顺着说）：<span class='en'>We provide private custom clothing, and at the same time we design.</span>",
   "<b>but</b> = 转折（剧情反转）：<span class='en'>We support small changes, but it will produce extra fees.</span>（extra fees 额外费用）",
   "<b>so</b> = 结果/结论（有头有尾）：<span class='en'>We do small-batch customization, so we can take different sizes of customers.</span>",
   "记住这三个就够：and 顺着说、but 转折、so 下结论。"]},
  {t:"核心语法 · 副词放哪里？",type:"list",items:[
   "<b>副词（currently 目前 / originally 本来 / recently 最近）不能放句尾！</b>",
   "<b>位置① 句首：</b><span class='en'>Currently I am a fashion designer.</span>",
   "<b>位置② 动词旁边（be 动词后）：</b><span class='en'>I am currently a fashion designer.</span>",
   "两个位置看哪个顺口用哪个，唯独不能放最后。",
   "want to 后面直接加动词原形：<span class='en'>I want to develop abroad.</span>（develop 发展）"]},
  {t:"造句大练兵 · 六句核心句",type:"table",rows:[

   ["客户不熟悉我们的品牌，所以我向她介绍了我们的系列。","The customer is not familiar with this brand, so I introduced our collection to her."],

  {t:"脱稿复述 & 自由描述",type:"dialog",lines:[

{
 id:7, date:"2026-09-28", title:"第七课：自我介绍 1.0 整段输出 + 中秋实战",
 subtitle:"六句连成一段话 · 1分钟计时挑战 · and/but/so 描述节日",
 review:["① 关键词法练新话题：用同样的方法准备 2 个新话题（我的公司 / 我的爱好），每个列 4-6 个关键词。","② 1 分钟计时挑战：每周录一次演讲，目标是比上周快 10 秒。","③ 范文跟读 3 遍法：第 1 遍看稿跟读，第 2 遍半脱稿，第 3 遍只看关键词。","④ 改说练习：找 3 个中文成语（如「人山人海」），练习用简单英语解释。"],
 extra:["<b>演讲万能结构 PREP：</b>Point（观点）→ Reason（原因）→ Example（例子）→ Point（重复观点），1 分钟刚刚好。","<b>up and downs 的姐妹表达：</b>ups and downs of life 人生的起起落落 / sweet and bitter 苦与甜。","<b>「人山人海」怎么说？</b>There are crowds of people. / It's packed.（被塞满了）","<b>数字加分技巧：</b>演讲里加数字更可信，如 We export to 12 countries."],
 sections:[
  {t:"开场 · 用 and/but/so 描述中秋节",type:"dialog",lines:[
   ["Mike","Have you had the moon cake? How was your Mid-Autumn Festival?"],
   ["Hanna","I'm very glad to spend the festival because I had lunch with my family."],
   ["Hanna","And there is a lot of good food, but I think I may get fat."],
   ["Mike","So what do you want to do?"],

function renderNav(active){
  let h='<div class="navtitle">课程笔记</div>';
  LESSONS.forEach(l=>{
    const badge=l.pending?"待更新":String(l.date).slice(5);
    h+='<a href="#/lesson/'+l.id+'" data-go="#/lesson/'+l.id+'" class="'+(active==="lesson-"+l.id?"active":"")+'">📖 第'+(CN[l.id-1]||l.id)+'课<span class="badge">'+badge+"</span></a>";
  });

  nav.innerHTML=h;
}

function secHtml(s){
  if(s.type==="dialog"){
    return '<section class="card"><h3><span class="num">💬</span>'+s.t+"</h3>"+
    s.lines.map(l=>'<div class="line"><span class="who">'+esc(l[0])+':</span> <span class="txt en">'+esc(l[1])+"</span> "+SPK(l[1])+"</div>").join("")+
    (s.note?'<div class="tip">💡 '+s.note+"</div>":"")+"</section>";
  }
  if(s.type==="article"){
    return '<section class="card"><h3><span class="num">📄</span>'+s.t+'</h3><div class="article">'+
    s.paras.map(p=>'<p class="en">'+esc(p[0])+" "+SPK(p[0])+'</p><p class="cn">'+esc(p[1])+"</p>").join("")+
    '</div>'+(s.note?'<div class="tip">💡 '+s.note+"</div>":"")+"</section>";
  }
  if(s.type==="table"){
    return '<section class="card"><h3><span class="num">🎯</span>'+s.t+'</h3>'+
    '<table class="pairs"><tr><th style="width:45%">中文</th><th>English</th></tr>'+
    s.rows.map(r=>'<tr><td>'+esc(r[0])+'</td><td><span class="en">'+esc(r[1])+"</span> "+SPK(r[1])+"</td></tr>").join("")+"</table></section>";
  }
  if(s.type==="homework"){
    return '<section class="card"><h3><span class="num">📝</span>'+s.t+'</h3><div class="homework-box"><b>作业：</b>'+s.text+"</div></section>";
  }
  return '<section class="card"><h3><span class="num">📌</span>'+s.t+'</h3><ul class="lines">'+
  s.items.map(i=>"<li>"+i+"</li>").join("")+"</ul>"+
  (s.note?'<div class="tip">💡 '+s.note+"</div>":"")+"</section>";
}

  '<div class="grid-vocab">'+list.map(w=>
   '<div class="vcard">'+
    '<div class="top"><span class="word">'+esc(w.w)+"</span>"+SPK(w.w)+'<span class="ph">'+esc(w.p)+'</span><span class="pos">'+esc(w.pos)+"</span></div>"+
    '<div class="mean">'+esc(w.m)+"</div>"+
    '<div class="ex en">'+esc(w.e)+" "+SPK(w.e)+"</div>"+
    (w.em?'<div class="excn">'+esc(w.em)+"</div>":"")+
   "</div>").join("")+"</div>";
}
/* 生词分类筛选（事件委托） */
document.addEventListener("click",function(e){
  const b=e.target.closest("[data-filter]");
  if(b){curFilter=b.dataset.filter;renderVocab();}
});
function route(){
  const h=location.hash;
  const m=h.match(/#\/lesson\/(\d+)/);
  if(m)renderLesson(+m[1]);
  else if(h==="#/vocab")renderVocab();
  else renderHome();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
